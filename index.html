<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Renter Lookup</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
        <!-- Header with Logo -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center">
      <img src="logo.png" alt="Thess Sabino-Francisco Apartments" class="h-16 md:h-20 object-contain max-w-full">
      <p class="text-xs md:text-sm font-medium text-slate-500 mt-2 tracking-wide uppercase">Utility & Renter Lookup System</p>
    </header>

    <!-- Search Section -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-4 text-slate-800">Automated Search</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Meralco Search -->
        <div>
          <label for="meralcoInput" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Meralco Account / Meter #</label>
          <input type="text" id="meralcoInput" placeholder="Type Meralco #..." 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-900">
        </div>

        <!-- Maynilad Search -->
        <div>
          <label for="mayniladInput" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Maynilad Account / Meter #</label>
          <input type="text" id="mayniladInput" placeholder="Type Maynilad #..." 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-900">
        </div>
      </div>
    </section>

    <!-- Lookup Result Display -->
    <section id="resultCard" class="hidden bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-xl shadow-md transition-all">
      <p class="text-xs uppercase font-semibold text-blue-200 tracking-wider">Matched Renter Details</p>
      <div class="mt-2 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h3 id="resultName" class="text-2xl font-extrabold">--</h3>
        </div>
        <div class="bg-white/10 backdrop-blur-md px-4 py-3 rounded-lg text-xs space-y-1 border border-white/20">
          <p><strong>Meralco #:</strong> <span id="resultMeralco">--</span></p>
          <p><strong>Maynilad #:</strong> <span id="resultMaynilad">--</span></p>
        </div>
      </div>
    </section>

    <!-- Data Table -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h2 class="font-semibold text-slate-800">All Apartment Records</h2>
        <span id="recordCount" class="text-xs font-medium text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">0 records</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-semibold">
            <tr>
              <th class="p-3">Renter / Unit</th>
              <th class="p-3">Meralco Number</th>
              <th class="p-3">Maynilad Number</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200">
          </tbody>
        </table>
      </div>
    </section>

  </div>

      {"renter": "Flor S", "meralco": "", "maynilad": "67117900"}
    ];

    // DOM Elements
    const meralcoInput = document.getElementById('meralcoInput');
    const mayniladInput = document.getElementById('mayniladInput');
    const resultCard = document.getElementById('resultCard');
    const resultName = document.getElementById('resultName');
    const resultMeralco = document.getElementById('resultMeralco');
    const resultMaynilad = document.getElementById('resultMaynilad');
    const tableBody = document.getElementById('tableBody');
    const recordCount = document.getElementById('recordCount');

    // Clean strings for search matching
    function cleanVal(str) {
      return (str || '').toString().toLowerCase().replace(/[\s-]/g, '');
    }

    // Lookup handler
    function performLookup(sourceField) {
      const mVal = cleanVal(meralcoInput.value);
      const myVal = cleanVal(mayniladInput.value);

      if (sourceField === 'meralco' && mVal) mayniladInput.value = '';
      if (sourceField === 'maynilad' && myVal) meralcoInput.value = '';

      const searchVal = sourceField === 'meralco' ? mVal : myVal;

      if (!searchVal) {
        resultCard.classList.add('hidden');
        renderTable(apartmentData);
        return;
      }

      // Search matching row
      const match = apartmentData.find(row => {
        const rowMeralco = cleanVal(row.meralco);
        const rowMaynilad = cleanVal(row.maynilad);
        
        if (sourceField === 'meralco') return rowMeralco.includes(searchVal);
        if (sourceField === 'maynilad') return rowMaynilad.includes(searchVal);
        return false;
      });

      if (match) {
        resultName.textContent = match.renter || 'Unknown Renter';
        resultMeralco.textContent = match.meralco || 'N/A';
        resultMaynilad.textContent = match.maynilad || 'N/A';
        resultCard.classList.remove('hidden');

        renderTable([match]);
      } else {
        resultCard.classList.add('hidden');
        renderTable([]);
      }
    }

    meralcoInput.addEventListener('input', () => performLookup('meralco'));
    mayniladInput.addEventListener('input', () => performLookup('maynilad'));

    // Render Data Table
    function renderTable(data) {
      recordCount.textContent = `${data.length} records`;

      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">No matching records found</td></tr>`;
        return;
      }

      tableBody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-50 border-b border-slate-100">
          <td class="p-3 font-medium text-slate-900">${row.renter || '-'}</td>
          <td class="p-3">${row.meralco || '-'}</td>
          <td class="p-3">${row.maynilad || '-'}</td>
        </tr>
      `).join('');
    }

    // Initialize table on load
    renderTable(apartmentData);
  </script>
</body>
</html>
